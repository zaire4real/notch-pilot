[package]
name = "notch-pilot"
version = "0.1.0"
description = "Clean-room Rust + Tauri 2 MVP of a Dynamic Island-like notch panel for MacBook"
authors = ["YiChia"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "notch_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# objc2 is only needed on macOS. On Linux `cargo check` still parses the
# non-macOS stub in notch.rs / media.rs / system.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = true
codegen-units = 1
