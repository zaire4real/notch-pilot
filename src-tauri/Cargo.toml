[package]
name = "notch-pilot"
version = "0.2.1"
description = "Clean-room Rust + Tauri 2 MVP of a Dynamic Island-like notch panel for MacBook"
authors = ["YiChia"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "notch_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# objc2 is only needed on macOS. On Linux `cargo check` still parses the
# non-macOS stub in notch.rs / media.rs / system.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSGraphics", "NSImageRep"] }
objc2-foundation = "0.3"
# Camera mirror (v0.2 Phase 5): AVCaptureSession +
# AVCaptureVideoDataOutput via the generated bindings — the crate
# exists for objc2 0.6 (verified against the real 0.3.2 source).
objc2-av-foundation = { version = "0.3", features = ["AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureDevice", "AVCaptureInput", "AVCaptureVideoDataOutput", "AVCaptureOutputBase", "AVMediaFormat", "dispatch2", "objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
# Serial dispatch queue the capture delegate runs on.
dispatch2 = "0.3"

[profile.release]
lto = true
codegen-units = 1
