<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotchPilot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="notch" class="collapsed" aria-label="NotchPilot">
    <!-- Collapsed pill: always visible. Left cluster = live activity
         (art thumb + visualizer bars while playing, "simple eyes"
         while idle if enabled); right cluster = battery. No clock
         here — the menu bar already shows the time. -->
    <div id="pill">
      <span id="pill-left" class="pill-left">
        <img id="pill-art" class="pill-art" alt="" hidden />
        <span id="pill-viz" class="pill-viz" hidden></span>
        <span id="pill-eyes" class="pill-eyes" hidden><span class="eye"></span><span class="eye"></span></span>
      </span>
      <span id="pill-battery" class="pill-item">🔋 --%</span>
    </div>

    <!-- Sneak-peek: transient one-line HUD (~70px tall, auto-collapses
         after ~2s). Same width as the expanded panel. Content is set
         by main.js; the first peek kind is "track changed". -->
    <div id="sneak-peek" hidden>
      <img id="peek-art" class="peek-art" alt="" hidden />
      <span id="peek-text" class="peek-text"></span>
    </div>

    <!-- Expanded panel: shown on hover -->
    <div id="panel">
      <!-- Home view: media → calendar → bottom strip (§5.2). -->
      <div id="view-home" class="panel-view">
        <section class="media-block">
          <div class="np-art-wrap">
            <!-- Visualizer bars sit behind the album art (§5.2). The
                 bar spans are built by main.js; the container is hidden
                 when the visualizer is off or nothing is playing. -->
            <div id="np-viz" class="np-viz" hidden></div>
            <img id="np-art" class="np-art" alt="" hidden />
            <span id="np-viz-label" class="np-viz-label muted" data-i18n="vizAnimated" hidden></span>
          </div>
          <div class="np-right">
            <div class="np-text">
              <div id="np-title" class="np-title"></div>
              <div id="np-artist" class="muted"></div>
            </div>
            <div class="np-controls">
              <button id="btn-prev" type="button" data-i18n-title="previous">⏮</button>
              <button id="btn-play" type="button" data-i18n-title="playPause">▶</button>
              <button id="btn-next" type="button" data-i18n-title="next">⏭</button>
              <select id="np-output" class="np-output" data-i18n-title="audioOutputLabel"></select>
              <button id="btn-settings" type="button" data-i18n-title="settings">⚙</button>
            </div>
          </div>
        </section>

        <section class="np-progress" id="np-progress-row" hidden>
          <span id="np-elapsed" class="np-time">0:00</span>
          <input id="np-seek" type="range" min="0" max="100" step="0.1" value="0" data-i18n-title="seek" />
          <span id="np-total" class="np-time">0:00</span>
        </section>
        <div id="np-lyric" class="np-lyric muted" hidden></div>

        <!-- Calendar block: real data from Phase 3 (calendar.rs via
             AppleScript to Calendar.app / Reminders.app). The
             weekday/date/time header is filled by refreshTime();
             the event list, TOMORROW row, countdown and reminders
             are filled by refreshCalendar() in main.js. -->
        <section class="calendar-block">
          <div class="cal-header">
            <div class="cal-date-wrap">
              <div id="cal-weekday" class="cal-weekday"></div>
              <div class="muted"><span id="cal-date"></span> · <span id="cal-time"></span></div>
            </div>
            <div id="cal-next" class="cal-next muted" data-i18n="calNoEvents"></div>
          </div>
          <div id="cal-status" class="cal-status muted" hidden></div>
          <ul id="cal-events" class="cal-events">
            <li class="muted" data-i18n="calNoEvents"></li>
          </ul>
          <div class="cal-tomorrow">
            <span class="cal-tomorrow-label" data-i18n="calTomorrow"></span>
            <span id="cal-tomorrow-event" class="muted" data-i18n="calTomorrowNone"></span>
          </div>
          <div id="cal-reminders-wrap" class="cal-reminders-wrap">
            <span class="rem-title" data-i18n="remindersTitle"></span>
            <div id="rem-status" class="cal-status muted" hidden></div>
            <ul id="rem-list" class="rem-list"></ul>
            <span id="rem-empty" class="muted" data-i18n="remindersEmpty"></span>
          </div>
        </section>

        <section class="bottom-strip">
          <!-- Mirror tile: placeholder in Phase 2 (live preview comes
               in Phase 5). -->
          <button id="mirror-tile" class="mirror-tile" type="button">
            <span class="mirror-dot">◉</span>
            <span data-i18n="secMirror"></span>
            <span class="muted mirror-soon" data-i18n="mirrorSoon"></span>
          </button>
          <button id="shelf-chip" class="shelf-chip" type="button"></button>
        </section>
      </div>

      <!-- Shelf view: replaces Home while open (same window).
           Phase 4a: paths persist in settings.json, click opens,
           × / right-click removes. Phase 4b: the AirDrop button is
           live — it sends every file on the shelf (see main.js);
           #airdrop-status shows the result or the error. -->
      <div id="view-shelf" class="panel-view" hidden>
        <div class="shelf-header">
          <span class="shelf-title" data-i18n="shelf"></span>
          <button id="btn-shelf-back" type="button" data-i18n="back">←</button>
        </div>
        <ul id="shelf-list" class="shelf-grid"></ul>
        <div class="shelf-dropzone">
          <span data-i18n="shelfHint"></span>
          <button id="btn-airdrop" class="shelf-airdrop" type="button"></button>
          <div id="airdrop-status" class="airdrop-status muted" role="status"></div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
