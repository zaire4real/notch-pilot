<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotchPilot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="notch" class="collapsed" aria-label="NotchPilot">
    <!-- Collapsed pill: always visible. No clock here (original
         parity): the menu bar already shows the time. -->
    <div id="pill">
      <span id="pill-battery" class="pill-item">🔋 --%</span>
    </div>

    <!-- Expanded panel: shown on hover -->
    <div id="panel">
      <section class="row">
        <div>
          <div id="clock" class="big">--:--</div>
          <div id="date" class="muted"></div>
        </div>
        <div id="battery" class="battery">🔋 --%</div>
      </section>

      <section class="row now-playing">
        <div class="np-text">
          <div id="np-title" class="np-title"></div>
          <div id="np-artist" class="muted"></div>
        </div>
        <div class="np-controls">
          <button id="btn-prev" type="button" data-i18n-title="previous">⏮</button>
          <button id="btn-play" type="button" data-i18n-title="playPause">▶</button>
          <button id="btn-next" type="button" data-i18n-title="next">⏭</button>
          <button id="btn-settings" type="button" data-i18n-title="settings">⚙</button>
        </div>
      </section>

      <section class="shelf">
        <div class="shelf-title"><span data-i18n="shelf"></span> <span class="muted" data-i18n="shelfHint"></span></div>
        <ul id="shelf-list"></ul>
      </section>

      <footer class="muted">
        <span data-i18n="footerNote"></span>
        <span class="settings-note" data-i18n="settingsNote"></span>
      </footer>
    </div>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
